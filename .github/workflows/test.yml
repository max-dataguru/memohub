name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        run: |
          v=8.30.1
          f=gitleaks_${v}_linux_x64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v$v/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null
      - name: Pull images
        run: docker pull -q pgvector/pgvector:pg17 && docker pull -q postgres:17
      - name: Migrations and smoke
        run: tests/run-local.sh
      - name: Backup roundtrip
        run: tests/backup-roundtrip.sh
      - name: Search and dedup eval
        run: tests/run-eval.sh
      # The Mac jobs run the system python3 (3.9): test the Python scripts on it.
      - name: Capture scanner and distiller on Python 3.9
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/w" -w /w python:3.9-slim \
            sh -c 'python -I tests/capture_test.py && python -I tests/distill_test.py'
